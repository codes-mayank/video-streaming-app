# Local Docker Compose reference config (fixed upstream hostnames).
# Prefer the main image + env vars instead:
#   AUTH_UPSTREAM=http://auth-service:8000
#   VIDEO_UPSTREAM=http://video-service:8001
#   NGINX_RESOLVER=127.0.0.11
events {}

http {
    client_max_body_size 2G;

    upstream auth_service {
        server auth-service:8000;
    }

    upstream video_service {
        server video-service:8001;
    }

    server {
        listen 80;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /users/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /videos {
            proxy_pass http://video_service/videos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /videos/ {
            proxy_pass http://video_service/videos/;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
