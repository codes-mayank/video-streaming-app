services:
  api-gateway:
    build: .
    image: umtube-api-gateway:latest
    container_name: api-gateway
    ports:
      - "8090:80"
    depends_on:
      - redis
    # Local hybrid mode (apps on host): uncomment to override with host.docker.internal routes
    # volumes:
    #   - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
